name: CI
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR replaces the run in progress; pushes to main each run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-4|py3.14|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (lint + format)
        env:
          SKIP: mypy
        run: uvx pre-commit run --all-files

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --no-install-project --all-groups

      - name: Run mypy
        working-directory: ./backend
        run: uv run mypy --strict src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cortexdj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cortexdj_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Dummy provider keys: tests use TestModel/FunctionModel and block real calls (tests/conftest.py).
      OPENAI_API_KEY: sk-test-deterministic-no-real-calls
      ANTHROPIC_API_KEY: sk-ant-test-deterministic-no-real-calls
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --all-groups

      - name: Run tests + coverage
        working-directory: ./backend
        # Tiers are directories: naming both runs unit + integration (evals stay out of PR CI).
        # Coverage floor at 75% (baseline ~80%); ratchet up as coverage grows.
        run: uv run pytest -o faulthandler_timeout=120 tests/unit tests/integration --cov=cortexdj --cov-report=term-missing:skip-covered --cov-fail-under=75

  frontend-lint:
    name: Frontend Lint and SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Lint
        run: pnpm -C frontend lint

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check generated SDK
        run: |
          pnpm -C frontend generate-client
          git diff --exit-code -- frontend/api/generated
          test -z "$(git ls-files --others --exclude-standard -- frontend/api/generated)"

      - name: Typecheck
        run: pnpm -C frontend typecheck
