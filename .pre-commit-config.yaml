
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.5
    hooks:
      # Run the linter.
      - id: ruff
        name: ruff-backend
        files: ^backend/(src|tests)/.*.py$
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        name: ruff-format-backend
        files: ^backend/(src|tests)/.*.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Mypy version.
    rev: v2.4.1
    hooks:
      - id: mypy
        name: mypy-backend
        language: system
        files: ^backend/(src|tests)/.*.py$
        entry: /bin/bash -c "cd backend && uv sync --frozen --no-install-project --all-groups && uv run mypy --strict src tests"

  - repo: local
    hooks:
      # The dependency-direction contracts in backend/pyproject.toml.
      - id: import-linter
        name: import-linter-backend
        language: system
        files: ^backend/(src/.*\.py|pyproject\.toml)$
        pass_filenames: false
        entry: /bin/bash -c "cd backend && uv run --frozen lint-imports"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: requirements-txt-fixer
      - id: end-of-file-fixer
        # Generated by archify; keep byte-for-byte so re-renders diff cleanly.
        exclude: ^docs/architecture/diagrams/.*/
      - id: trailing-whitespace
        exclude: ^docs/architecture/diagrams/.*/
      - id: check-toml
      - id: check-yaml
        exclude: ^frontend/
