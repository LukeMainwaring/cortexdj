services:
  postgres:
    # pgvector image (Postgres + the vector extension) for the embeddings feature.
    # Left unconditional: it's a strict superset of stock Postgres, so it works
    # unchanged if embeddings is pruned (the extension simply goes unused).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: cortexdj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    ports:
      - "5433:5432"
    volumes:
      # PG18+ images store data in a version-specific subdir; mount at
      # /var/lib/postgresql (not /var/lib/postgresql/data, the pre-18 path).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortexdj

  backend:
    build:
      context: ./backend
      target: local
    ports:
      - "8003:8003"
    environment:
      ENVIRONMENT: development
      UVICORN_PORT: 8003
      POSTGRES_DB: cortexdj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      # Checkpoints and datasets; .dockerignore keeps data/ out of the image.
      - ./backend/data:/app/data
      # The CBraMod backbone is fetched from the Hugging Face hub on first load;
      # the volume keeps it across container recreations.
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cortexdj

networks:
  cortexdj:
    attachable: true

volumes:
  postgres_data:
  huggingface_cache:
