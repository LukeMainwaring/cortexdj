[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortexdj"
version = "0.1.0"
description = "AI-powered EEG brain-wave classifier and Spotify playlist curator"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.20.1",
  "asyncpg>=0.32.0",
  "fastapi[standard]>=0.165.0",
  "logfire[fastapi,sqlalchemy]>=5.6.0",
  "opentelemetry-api>=1.45.2",
  "psycopg[binary,pool]>=3.3.9",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "pydantic-ai>=2.71.0",
  # <2.1 until opentelemetry-instrumentation-sqlalchemy (logfire) supports 2.1; out of its range,
  # logfire.instrument_sqlalchemy raises at startup. Check its cap:
  # curl -s https://pypi.org/pypi/opentelemetry-instrumentation-sqlalchemy/json | python3 -c 'import json,sys; print([r for r in json.load(sys.stdin)["info"]["requires_dist"] if "sqlalchemy" in r])'
  "sqlalchemy[asyncio]>=2.0.58,<2.1",
  "uvicorn>=0.54.0",
  "torch>=2.15.0",
  "braindecode>=2.0.0",
  "numpy>=2.5.5",
  "scipy>=1.18.1",
  "librosa>=1.0.1",
  "transformers>=5.23.0",
  "spotipy>=2.26.0",
  "pgvector>=0.5.1",
  "httpx>=0.28.1",
]

[project.scripts]
seed-sessions = "cortexdj.scripts.seed_sessions:main"
seed-track-index = "cortexdj.scripts.seed_track_index:main"
train-classifier = "cortexdj.training.command:main"

[dependency-groups]
dev = [
  "import-linter>=2.17",
  "mypy>=2.4.1",
  "pre-commit>=4.7.0",
  "pydantic-evals>=2.71.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# A tier is a directory. Bare `pytest` runs the fast, DB-free `tests/unit`; name a
# directory to run another tier (`pytest tests/integration` needs the test database).
# `pytest tests/evals` needs real provider keys and the test database: use scripts/run-evals.sh.
# Tests are packages (an __init__.py per dir) so the same basename can recur across
# tiers without an import collision.
testpaths = ["tests/unit"]
addopts = "-q"
strict = true
# Async tests and fixtures run under anyio without a per-test marker.
anyio_mode = "auto"
# A warning is a failure, so deprecations surface when they appear, not when they break.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cortexdj"]
branch = true
# SQLAlchemy's async driver runs on greenlets; without this, lines after a DB await go uncounted.
concurrency = ["greenlet", "thread"]
omit = ["*/migrations/*", "*/scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# No `fail_under` here: the floor is for the unit and integration tiers together, so
# a coverage run of the DB-free `unit` tier alone would fail it. The gate lives as a
# CLI flag in the CI `test` job instead (see .github/workflows/ci.yml).

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["braindecode.*", "pgvector.*", "scipy.*", "sklearn.*", "spotipy.*"]
ignore_missing_imports = true


[tool.deptry]
# Run by the updating-deps skill. asyncpg is loaded by SQLAlchemy as the driver, never imported;
# starlette is imported directly in the usual FastAPI way. sklearn is imported only by the
# cross-subject baseline script and stays transitive: braindecode installs it.
known_first_party = ["cortexdj"]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg"]
DEP003 = ["sklearn", "starlette"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["I", "F401", "UP", "FAST", "ASYNC", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock.patch".msg = "Fake at a seam (a FastAPI dependency, an `override` context manager, a constructor argument); see docs/adr/0001-test-tiers-and-fakes.md."
"sqlmodel".msg = "Models use SQLAlchemy 2.0 directly: the table in model.py and the API shape in schema.py stay separate classes."

# The dependency direction from AGENTS.md, run by pre-commit as `lint-imports`. The capability
# registry and the named-agent registry are composition roots that import a slice's capability or
# agent builder, so both contracts ignore their edges; without that, independence fails on the
# indirect path a slice takes to another slice through the agent runtime. An ignore that matches
# nothing only warns: the named-agent registry imports no slice until a domain registers its own
# agent builder there. The ML inference kernel (`cortexdj.ml`) may import only `cortexdj.core`
# among this repo's packages.
[tool.importlinter]
root_package = "cortexdj"

[[tool.importlinter.contracts]]
name = "Feature slices never import each other"
type = "independence"
modules = ["cortexdj.features.*"]
ignore_imports = [
  "cortexdj.agents.capabilities -> cortexdj.features.**",
  "cortexdj.agents.registry -> cortexdj.features.**",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "The kernel never imports a feature slice"
type = "forbidden"
source_modules = [
  "cortexdj.core",
  "cortexdj.shared",
  "cortexdj.agents",
  "cortexdj.ml",
]
forbidden_modules = ["cortexdj.features"]
ignore_imports = [
  "cortexdj.agents.capabilities -> cortexdj.features.**",
  "cortexdj.agents.registry -> cortexdj.features.**",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "The ML kernel imports only the platform kernel"
type = "forbidden"
source_modules = ["cortexdj.ml"]
forbidden_modules = [
  "cortexdj.shared",
  "cortexdj.agents",
  "cortexdj.features",
  "cortexdj.api",
  "cortexdj.app",
  "cortexdj.migrations",
]

[[tool.importlinter.contracts]]
name = "Nothing in the app imports the training package"
type = "forbidden"
source_modules = [
  "cortexdj.core",
  "cortexdj.shared",
  "cortexdj.agents",
  "cortexdj.ml",
  "cortexdj.features",
  "cortexdj.scripts",
  "cortexdj.migrations",
  "cortexdj.api",
  "cortexdj.app",
]
forbidden_modules = ["cortexdj.training"]

[[tool.importlinter.contracts]]
name = "The training package imports only the ML kernel and the platform kernel"
type = "forbidden"
source_modules = ["cortexdj.training"]
forbidden_modules = [
  "cortexdj.shared",
  "cortexdj.agents",
  "cortexdj.features",
  "cortexdj.scripts",
  "cortexdj.api",
  "cortexdj.app",
  "cortexdj.migrations",
]

[tool.uv]
default-groups = ["dev"]
